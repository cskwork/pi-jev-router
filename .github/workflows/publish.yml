name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (must match package.json, e.g. v0.8.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: nubjs/setup-nub@v0.6.0
        with:
          nub-version: 0.1.10
          node-version: 24.20.0
      - name: Check release tag matches package version
        run: |
          nub -e 'const assert = require("node:assert/strict"); const { version } = require("./package.json"); assert.match(version, /^\d+\.\d+\.\d+$/); assert.equal(process.env.RELEASE_TAG, `v${version}`);'
      - run: nub install --frozen-lockfile --ignore-scripts
      - run: nub run test
      # npm's native CLI handles the trusted-publisher OIDC token exchange.
      # No NPM_TOKEN, NODE_AUTH_TOKEN, login, or OTP is needed.
      - run: npm publish --access public --registry https://registry.npmjs.org/
