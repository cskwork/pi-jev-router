name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: nubjs/setup-nub@v0.6.0
        with:
          nub-version: 0.1.10
          node-version: 24.20.0
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          nub -e 'const assert = require("node:assert/strict"); const { version } = require("./package.json"); assert.match(version, /^\d+\.\d+\.\d+$/); assert.equal(process.env.RELEASE_TAG, `v${version}`);'
      - run: nub install --frozen-lockfile --ignore-scripts
      - run: nub run test
      # npm's native CLI handles the trusted-publisher OIDC token exchange.
      # No NPM_TOKEN, NODE_AUTH_TOKEN, login, or OTP is needed.
      - run: npm publish --access public --registry https://registry.npmjs.org/
