name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0.6.0
        with:
          nub-version: 0.1.10
          node-version: 22.19.0
      - run: nub install --frozen-lockfile --ignore-scripts
      - run: nub run test
      - run: python3 -m unittest discover -s scripts -p '*_test.py'
      - run: nub run docs
      - run: git diff --exit-code -- docs/
